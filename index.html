<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>海上賽船 — 因數與倍數雙人對戰</title>
<meta name="description" content="兩隊各選一個角色上船。兩個人各站一邊，答對一題因數或倍數，船就往前一格，先到終點的贏。翰林版五年級上學期數學第二單元。">
<meta name="theme-color" content="#35B6CC">
<meta property="og:type" content="website">
<meta property="og:title" content="海上賽船">
<meta property="og:description" content="因數與倍數雙人對戰。答對一題，船就往前一格，先到終點的贏。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Ctext%20y=%22.9em%22%20font-size=%2290%22%3E%E2%9B%B5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Huninn&family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0A3F5C; --sea:#14889E; --shallow:#5CC9CF; --foam:#F2FBFA;
  --sand:#F3DDA6; --sand-d:#DDBF7C;
  --octo:#6A4BD6; --octo-d:#4A2FA8; --octo-t:#ECE7FB;
  --crab:#EE5A3C; --crab-d:#B93A22; --crab-t:#FDE9E4;
  --sun:#FFC83D; --sun-d:#C98F00;
  --ink:#0B3148; --ok:#12A66A; --no:#D7263D;
  --gap:clamp(8px,1.2vw,20px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  min-height:100dvh; overflow-x:hidden; color:var(--ink);
  font-family:"Fredoka","Huninn","Noto Sans TC",system-ui,sans-serif; font-weight:600;
  background:linear-gradient(180deg,#8FD6F7 0%,#CDEFFD 46%,#EAF9FE 100%) fixed;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font-family:inherit;font-weight:inherit;color:inherit}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* ── 比賽場地：左板｜海｜右板 ── */
#arena{
  display:grid; grid-template-columns:minmax(210px,1fr) minmax(0,2.4fr) minmax(210px,1fr);
  grid-template-areas:"left scene right";
  gap:var(--gap); padding:var(--gap); height:100dvh; min-height:520px;
}
#scene{grid-area:scene; position:relative; min-width:0; min-height:0}
.panel.left{grid-area:left} .panel.right{grid-area:right}

/* ── 作答板 ── */
.panel{
  --team:var(--octo); --team-d:var(--octo-d); --team-t:var(--octo-t);
  position:relative; z-index:2; min-height:0; display:flex; flex-direction:column;
  background:var(--foam); border-radius:26px; overflow:hidden;
  box-shadow:0 8px 0 rgba(5,42,64,.38);
}
.panel.right{--team:var(--crab); --team-d:var(--crab-d); --team-t:var(--crab-t)}
.p-head{
  position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--team); color:#fff; padding:clamp(8px,1.5vh,16px) clamp(12px,1.4vw,22px) clamp(6px,1.1vh,12px);
}
/* 標題下緣的浪花：一排往下垂的圓弧 */
.p-head::after{
  content:""; position:absolute; left:0; right:0; top:100%; height:12px;
  background:radial-gradient(circle at 50% 0,var(--team) 0 11px,transparent 12px) repeat-x;
  background-size:26px 12px;
}
.p-name{font-size:clamp(20px,3.2vh,36px); letter-spacing:.04em}
.p-score{font-size:clamp(14px,2vh,22px); white-space:nowrap}
.p-score b{font-size:1.5em; font-weight:700; margin:0 .12em}

.p-q{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:clamp(16px,2.4vh,26px) 12px 4px; gap:.25em;
}
.q-title{font-size:clamp(15px,2.9vh,32px); color:var(--team-d)}
.q-body{font-size:clamp(24px,5.4vh,60px); font-weight:700; line-height:1.3; color:var(--ink); text-wrap:balance}
.q-body.mid{font-size:clamp(21px,4.3vh,48px)}
.q-body.long{font-size:clamp(19px,3.5vh,40px)}
/* 頓號是全形，整格寬度會把數列撐得很長；收窄一點，數列才不會動不動就斷行 */
.q-body .sep{font-style:normal; margin:0 -.2em 0 -.06em}
.q-body .it{display:inline-block; white-space:nowrap}
.blank{
  display:inline-block; width:1.15em; height:1.15em; vertical-align:-.2em; margin:0 .08em;
  border:.11em dashed var(--team); border-radius:.25em; background:var(--team-t);
}

.p-ans{
  margin:4px clamp(12px,1.4vw,22px) 0; height:clamp(46px,7.4vh,78px); flex:none;
  display:flex; align-items:center; justify-content:center;
  border:4px solid var(--team); border-radius:999px; background:#fff;
  font-size:clamp(26px,4.8vh,50px); font-weight:700; color:var(--team-d);
  transition:background .15s,border-color .15s;
}
.p-ans.empty{color:#B7C6CE}
.p-msg{
  flex:none; height:clamp(22px,3.4vh,36px); line-height:clamp(22px,3.4vh,36px); text-align:center;
  font-size:clamp(13px,2vh,22px); color:var(--team-d); white-space:nowrap; overflow:hidden;
}
.panel.good .p-ans{background:#DDF7EA; border-color:var(--ok); color:var(--ok)}
.panel.good .p-msg{color:var(--ok)}
.panel.bad .p-ans{background:#FDE3E6; border-color:var(--no); color:var(--no); animation:shake .34s}
.panel.bad .p-msg{color:var(--no)}
.panel.locked .keys{opacity:.4}
.panel.locked .keys button{pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}55%{transform:translateX(7px)}80%{transform:translateX(-3px)}}

/* 圓形泡泡鍵。鍵盤寬度同時受「面板寬」和「螢幕高」限制，矮螢幕也不會被切掉 */
.keys{
  flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(6px,1.2vh,14px);
  width:min(calc(100% - 2*clamp(12px,1.4vw,22px)), calc((100dvh - 330px) * .76));
  margin:0 auto; padding-bottom:clamp(12px,2vh,22px);
}
.keys button{
  appearance:none; border:3px solid rgba(11,49,72,.12); background:#fff; border-radius:50%;
  aspect-ratio:1; min-width:44px; min-height:44px; cursor:pointer; padding:0;
  font-size:clamp(22px,3.6vh,44px); font-weight:700; color:var(--ink);
  box-shadow:0 5px 0 rgba(11,49,72,.16), inset 0 -6px 0 rgba(11,49,72,.04);
  transition:transform .06s, box-shadow .06s;
}
.keys button:active,.keys button.hit{transform:translateY(4px); box-shadow:0 1px 0 rgba(11,49,72,.16)}
.keys button.k-clr{background:var(--sand); border-color:var(--sand-d); font-size:clamp(14px,2.2vh,24px); font-weight:600}
.keys button.k-ok{background:var(--team); border-color:var(--team-d); color:#fff; font-size:clamp(14px,2.2vh,24px); font-weight:600;
  box-shadow:0 5px 0 var(--team-d)}
.keys button.k-ok:active,.keys button.k-ok.hit{box-shadow:0 1px 0 var(--team-d)}

/* ── 中間的海 ── */
#hud{position:absolute; top:0; left:0; right:0; z-index:3; display:flex; align-items:center; justify-content:center; gap:clamp(8px,1vw,16px)}
#clock{
  min-width:4.2em; text-align:center; padding:.12em .5em; border-radius:999px;
  background:var(--deep); color:var(--sun); font-size:clamp(28px,5.4vh,60px); font-weight:700;
  font-variant-numeric:tabular-nums; box-shadow:0 5px 0 rgba(5,42,64,.4);
}
#clock.rush{background:var(--crab-d); color:#fff; animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.hud-btn{
  appearance:none; border:0; cursor:pointer; border-radius:999px; min-height:44px; padding:0 16px;
  background:rgba(242,251,250,.9); color:var(--deep); font-size:clamp(13px,1.9vh,19px);
  box-shadow:0 4px 0 rgba(5,42,64,.3);
}
.hud-btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(5,42,64,.3)}
#banner{
  position:absolute; top:clamp(70px,11vh,110px); left:50%; transform:translateX(-50%); z-index:3;
  background:var(--sun); color:var(--ink); padding:.3em 1em; border-radius:999px; white-space:nowrap;
  font-size:clamp(15px,2.5vh,26px); box-shadow:0 4px 0 var(--sun-d); display:none;
}
#banner.on{display:block}
#stage{position:absolute; left:0; bottom:0; width:100%; height:100%; overflow:visible; display:block}
/* 船：位置由程式設定（translate＋scale），前進時用彈一下的曲線滑過去 */
.boat{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.bob,.surge{transform-box:fill-box; transform-origin:50% 60%}
.bob{animation:bob 2.4s ease-in-out infinite alternate}
.bob.b2{animation-duration:2.9s; animation-delay:-1.1s}
@keyframes bob{from{transform:translateY(-3px) rotate(-1.3deg)}to{transform:translateY(3px) rotate(1.3deg)}}
.surge.leap{animation:surge .55s}
@keyframes surge{30%{transform:translateY(-9px) rotate(-5deg)}}
.foam{opacity:0}
.surge.leap .foam{animation:foam .6s}
@keyframes foam{15%{opacity:.95}to{opacity:0}}
/* 浪：一個波長是 100，往左平移剛好一個波長再重來，看起來就是一直在流 */
.wave{animation:flow 5s linear infinite}
.wave.w2{animation-duration:3.6s}
@keyframes flow{to{transform:translateX(-100px)}}
.cloud{animation:drift 70s linear infinite alternate}
.cloud.c2{animation-duration:95s; animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(60px)}}

/* ── 蓋在上面的畫面：設定、倒數、結果 ── */
.overlay{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
  padding:16px; background:rgba(6,45,68,.74); overflow:auto}
.overlay.on{display:flex}
.sheet{
  width:min(1060px,100%); background:var(--foam); border-radius:32px; text-align:center;
  padding:clamp(18px,3.4vh,36px) clamp(16px,3vw,40px) clamp(20px,3.6vh,38px);
  box-shadow:0 12px 0 rgba(5,42,64,.45); margin:auto;
}
.title{margin:0; font-family:"Huninn","Noto Sans TC",sans-serif; font-weight:400; color:var(--deep);
  font-size:clamp(44px,9.5vh,96px); line-height:1.05; letter-spacing:.06em}
.lede{margin:.4em auto 0; max-width:40em; text-wrap:balance; font-size:clamp(15px,2.4vh,22px); color:var(--ink); line-height:1.6; font-weight:500}
.hero{display:block; width:min(560px,100%); height:auto; margin:clamp(4px,1.4vh,14px) auto 0}
.hero{max-height:clamp(76px,13vh,170px)}
.lv-row{display:flex; justify-content:center; gap:clamp(6px,1.2vw,14px); flex-wrap:wrap}
.lv-row button{appearance:none; cursor:pointer; min-height:48px; padding:0 1.15em; border-radius:999px;
  border:3px solid rgba(11,49,72,.14); background:#fff; color:var(--ink); font-size:clamp(16px,2.5vh,22px);
  box-shadow:0 4px 0 rgba(11,49,72,.16)}
.lv-row button[aria-pressed="true"]{background:var(--deep); border-color:var(--deep); color:var(--sun); box-shadow:0 4px 0 #052A40}
#goalnote{margin-left:.7em; padding:.1em .7em; border-radius:999px; background:var(--sand); color:var(--ink); font-size:.86em}
.pick-label{margin:clamp(8px,1.8vh,18px) 0 8px; font-size:clamp(15px,2.3vh,21px); color:var(--deep)}
.mins{display:flex; justify-content:center; gap:clamp(6px,1.2vw,14px); flex-wrap:wrap}
.mins button{
  appearance:none; cursor:pointer; width:clamp(54px,9vh,84px); aspect-ratio:1; border-radius:50%;
  border:3px solid rgba(11,49,72,.14); background:#fff; color:var(--ink);
  font-size:clamp(20px,3.6vh,34px); font-weight:700; line-height:1; box-shadow:0 5px 0 rgba(11,49,72,.16);
}
.mins button small{display:block; font-size:.42em; font-weight:500; margin-top:.2em}
.mins button[aria-pressed="true"]{background:var(--deep); border-color:var(--deep); color:var(--sun); box-shadow:0 5px 0 #052A40}
.go{
  appearance:none; border:0; cursor:pointer; margin-top:clamp(14px,2.8vh,26px); min-height:60px; padding:.5em 1.8em;
  border-radius:999px; background:var(--sun); color:var(--ink); font-size:clamp(20px,3.4vh,32px); font-weight:700;
  box-shadow:0 7px 0 var(--sun-d);
}
.go:active{transform:translateY(5px); box-shadow:0 2px 0 var(--sun-d)}
.go.quiet{background:#fff; box-shadow:0 7px 0 rgba(11,49,72,.18); font-weight:600; margin-left:10px}
.opts{display:flex; justify-content:center; align-items:flex-end; gap:clamp(16px,4vw,60px); flex-wrap:wrap}
.rules{margin:clamp(8px,1.6vh,16px) auto 0; padding:0; list-style:none; max-width:44em; text-align:left;
  font-size:clamp(13px,1.95vh,19px); line-height:1.5; font-weight:500}
.rules li{padding-left:1.5em; position:relative; margin-top:.2em}
.rules li::before{content:""; position:absolute; left:.2em; top:.5em; width:.62em; height:.62em; border-radius:50%;
  border:.16em solid var(--sea)}
#count{background:rgba(6,45,68,.5)}
#count b{font-size:clamp(120px,34vh,300px); font-weight:700; color:var(--sun); text-shadow:0 10px 0 rgba(5,42,64,.5)}
#count b.pop{animation:pop .7s both}
@keyframes pop{from{transform:scale(.3); opacity:0}35%{transform:scale(1.12); opacity:1}to{transform:scale(1)}}
.win-name{margin:.1em 0 0; font-family:"Huninn","Noto Sans TC",sans-serif; font-weight:400;
  font-size:clamp(38px,8vh,80px); line-height:1.1}
.tally{display:flex; justify-content:center; gap:clamp(12px,3vw,40px); margin-top:clamp(10px,2vh,20px)}
.tally div{padding:.5em 1.1em; border-radius:20px; font-size:clamp(14px,2.2vh,20px); font-weight:500}
.tally b{display:block; font-size:2.1em; font-weight:700; line-height:1.1}
.teams{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:clamp(8px,1.4vw,18px); margin-top:clamp(6px,1.4vh,14px)}
.teams .pick-label{margin:0 0 6px}
.teams .hero{width:100%; margin:0}
.chars{display:grid; grid-template-columns:repeat(3,auto); gap:6px; justify-content:center}
.chars button{appearance:none; cursor:pointer; width:clamp(56px,8.6vh,98px); padding:4px 3px 5px; border-radius:16px;
  border:3px solid rgba(11,49,72,.12); background:#fff; color:var(--ink); font-size:clamp(12px,1.75vh,19px); line-height:1.1;
  box-shadow:0 4px 0 rgba(11,49,72,.14)}
.chars button svg{display:block; width:100%; height:auto; margin-bottom:2px; pointer-events:none}
.chars button[aria-pressed="true"]{border-color:var(--c); background:var(--t); box-shadow:0 4px 0 var(--c)}
.chars button:disabled{opacity:.25; cursor:default; box-shadow:none}
@media (max-width:700px){ .teams{grid-template-columns:1fr 1fr} .teams .hero{grid-column:1/-1; grid-row:1} }

/* ── 窄螢幕（直放的平板、手機）：海在上，兩塊板並排在下 ── */
@media (max-width:680px){
  #arena{grid-template-columns:1fr 1fr; grid-template-rows:38dvh minmax(0,1fr); grid-template-areas:"scene scene" "left right";
    height:auto; min-height:100dvh}
  #scene{overflow:hidden; border-radius:22px}
  .keys{width:min(calc(100% - 20px), 300px)}
  .keys button{min-width:0}
  .p-head{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){
  .bob,.wave,.cloud,#clock.rush{animation:none}
  .boat{transition-duration:.01s}
}
</style>
</head>
<body>

<main id="arena">
  <section class="panel left"  data-side="0" aria-label="章魚隊作答板"></section>

  <section id="scene" aria-label="賽船場地">
    <div id="hud">
      <button class="hud-btn" id="quit" type="button">回設定</button>
      <div id="clock" role="timer">2:00</div>
      <button class="hud-btn" id="mute" type="button" aria-pressed="true">音樂 開</button>
    </div>
    <div id="banner"></div>

    <svg id="stage" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
      <defs>
        <!-- 六個船員。都面向右邊，原點 (0,0) 是船頭、手伸到的位置；y 大於 12 的部分會被船身蓋住 -->
        <g id="cap">
          <path d="M-22 -5 Q-22 -27 0 -27 Q22 -27 22 -5 Z" fill="#fff" stroke="#0B3148" stroke-width="2.5"/>
          <rect x="-27" y="-9" width="54" height="11" rx="5.5" fill="#fff" stroke="#0B3148" stroke-width="2.5"/>
          <rect x="-21" y="-12" width="42" height="5" fill="#34407A"/>
        </g>
        <g id="peng">
          <path d="M-142 40 Q-146 -72 -94 -80 Q-42 -72 -46 40 Z" fill="#2B3566"/>
          <path d="M-126 40 Q-128 -20 -92 -24 Q-58 -20 -60 40 Z" fill="#fff"/>
          <ellipse cx="-80" cy="-48" rx="27" ry="19" fill="#fff"/>
          <circle cx="-92" cy="-52" r="6.5" fill="#0B3148"/><circle cx="-70" cy="-52" r="6.5" fill="#0B3148"/>
          <circle cx="-90" cy="-54" r="2" fill="#fff"/><circle cx="-68" cy="-54" r="2" fill="#fff"/>
          <path d="M-70 -44 L-42 -38 L-70 -31 Z" fill="#FF9F1C" stroke="#FF9F1C" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="-100" cy="-38" r="6" fill="#FF9DB5" opacity=".8"/>
          <path d="M-58 -6 C-42 -6,-22 -3,-4 0" fill="none" stroke="#2B3566" stroke-width="15" stroke-linecap="round"/>
          <use href="#cap" x="-94" y="-74"/>
        </g>
        <g id="dolph">
          <path d="M-134 -34 L-162 -72 L-112 -58 Z" fill="#3F8AD6" stroke="#3F8AD6" stroke-width="6" stroke-linejoin="round"/>
          <path d="M-146 40 Q-152 -40 -100 -64 Q-62 -74 -46 -46 L-12 -36 Q-2 -30 -12 -22 L-44 -16 Q-44 16 -52 40 Z" fill="#5BA7E8"/>
          <path d="M-128 40 Q-124 2 -84 -8 Q-56 -12 -46 -18 Q-44 16 -52 40 Z" fill="#E3F1FF"/>
          <circle cx="-72" cy="-44" r="9" fill="#fff"/><circle cx="-69" cy="-43" r="4.5" fill="#0B3148"/>
          <path d="M-52 -22 Q-32 -18 -14 -28" fill="none" stroke="#0B3148" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="-86" cy="-28" r="6" fill="#FF9DB5" opacity=".8"/>
          <path d="M-64 2 C-46 8,-24 7,-4 2" fill="none" stroke="#3F8AD6" stroke-width="15" stroke-linecap="round"/>
          <use href="#cap" x="-104" y="-60"/>
        </g>
        <g id="otter">
          <circle cx="-128" cy="-70" r="12" fill="#7E4E2A"/><circle cx="-58" cy="-74" r="12" fill="#7E4E2A"/>
          <path d="M-62 0 C-44 5,-24 6,-4 3" fill="none" stroke="#7E4E2A" stroke-width="15" stroke-linecap="round"/>
          <path d="M-142 40 Q-140 -4 -94 -6 Q-48 -4 -46 40 Z" fill="#9A6238"/>
          <circle cx="-92" cy="-42" r="46" fill="#9A6238"/>
          <ellipse cx="-82" cy="-30" rx="30" ry="24" fill="#EBD3AE"/>
          <ellipse cx="-76" cy="-40" rx="8" ry="6" fill="#0B3148"/>
          <path d="M-76 -34 V-27 M-88 -24 Q-82 -19 -76 -27 Q-70 -19 -64 -24" fill="none" stroke="#0B3148" stroke-width="3" stroke-linecap="round"/>
          <circle cx="-106" cy="-56" r="6" fill="#0B3148"/><circle cx="-62" cy="-60" r="6" fill="#0B3148"/>
          <circle cx="-104" cy="-58" r="2" fill="#fff"/><circle cx="-60" cy="-62" r="2" fill="#fff"/>
          <path d="M-54 -32 l17 -4 M-54 -25 l17 3" fill="none" stroke="#6E4322" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M-60 -12 C-42 -13,-22 -8,-3 -2" fill="none" stroke="#9A6238" stroke-width="15" stroke-linecap="round"/>
          <use href="#cap" x="-92" y="-84"/>
        </g>
        <g id="clown">
          <path d="M-148 -24 L-188 -56 Q-176 -24 -188 8 Z" fill="#F06A1A" stroke="#F06A1A" stroke-width="5" stroke-linejoin="round"/>
          <path d="M-118 -60 Q-94 -94 -64 -62 Z" fill="#F06A1A"/>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };

/* ===================================================================
   題目：翰林五上第二單元「倍數與因數」
   這個單元是第一次教因數和倍數，還沒有教到公因數、公倍數，
   題目文字只用學生這時候學過的說法。答案一律是一個整數，用數字鍵輸入，
   亂猜猜不中——選擇題在搶快的對戰裡會變成比誰按得快。
   =================================================================== */
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(arr){ return arr[ri(0,arr.length-1)]; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=ri(0,i), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function factorsOf(n){ var f=[]; for(var i=1;i<=n;i++) if(n%i===0) f.push(i); return f; }
var BLANK = '<span class="blank"></span>', SEP = '<i class="sep">、</i>';
/* 數列的每一項和它後面的頓號綁在一起，換行時頓號才不會跑到下一行開頭 */
function joinList(a){
  return a.map(function(x,i){ return '<span class="it">'+x+(i<a.length-1?SEP:'')+'</span>'; }).join('');
}

var GEN = {
  /* 倍數數列填空 */
  seq:function(lv){
    var base = lv===0 ? pick([2,3,4,5]) : pick([6,7,8,9,11,12]);
    var start = ri(1, lv===0?3:5), terms=[], i;
    for(i=0;i<5;i++) terms.push(base*(start+i));
    var hole = ri(2,4);
    return {type:"seq", title:base+" 的倍數，由小到大",
            body:joinList(terms.map(function(t,k){ return k===hole?BLANK:t; })), size:"mid",
            ans:terms[hole], meta:{base:base, terms:terms, hole:hole}};
  },
  /* 因數是成對出現的：a × □ ＝ n */
  pair:function(lv){
    var n = pick(lv===0 ? [12,15,16,18,20,24,28,30]
              : lv===1 ? [32,36,40,42,45,48,54,56,60,63,64,72]
                       : [75,80,81,84,90,96,100,108,120]);
    var f = factorsOf(n).filter(function(x){ return x!==1 && x!==n; });
    var a = pick(f);
    return {type:"pair", title:"找 "+n+" 的因數", body:a+" × "+BLANK+" ＝ "+n, ans:n/a, meta:{n:n, a:a}};
  },
  /* 最大的因數是自己、最小的因數是 1、最小的倍數是自己 */
  edge:function(){
    var n = ri(6,60), kind = pick(["maxF","minF","minM"]);
    if(kind==="maxF") return {type:"edge", title:n+" 的因數裡", body:"最大的是？", ans:n, meta:{n:n, kind:kind}};
    if(kind==="minF") return {type:"edge", title:n+" 的因數裡", body:"最小的是？", ans:1, meta:{n:n, kind:kind}};
    return {type:"edge", title:n+" 的倍數裡", body:"最小的是？", ans:n, meta:{n:n, kind:kind}};
  },
  /* 第幾個倍數 */
  nth:function(lv){
    var base = lv===0 ? ri(2,5) : lv===1 ? ri(3,9) : ri(6,12);
    var k    = lv===0 ? ri(2,6) : lv===1 ? ri(4,9) : ri(6,12);
    return {type:"nth", title:base+" 的倍數，由小到大", body:"第 "+k+" 個是？", ans:base*k, meta:{base:base, k:k}};
  },
  /* 把所有因數列出來，挖掉一個 */
  blank:function(lv){
    var n = pick(lv===0 ? [6,8,10,12,14,15,16,18]
               : lv===1 ? [20,21,22,26,27,28,32,33,34,35]
                        : [24,30,36,40,42,45,50,54,56]);
    var f = factorsOf(n), hole = ri(1, f.length-2);
    var body = joinList(f.map(function(x,k){ return k===hole?BLANK:x; }));
    return {type:"blank", title:n+" 的因數，由小到大", body:body, size:(f.length<=4?"":f.length<=6?"mid":"long"), ans:f[hole], meta:{n:n, hole:hole}};
  },
  /* 三個數裡，只有一個是倍數 */
  pickM:function(lv){
    var base = pick(lv<=1 ? [3,4,6,7,8,9] : [6,7,8,9,11,12,13]);
    for(;;){
      var m = base*ri(3, Math.min(12, Math.floor(99/base)));
      var d1 = m + pick([-1,1])*ri(1,base-1), d2 = m + pick([-1,1])*ri(1,base-1);
      if(d1===d2 || d1<10 || d2<10 || d1>99 || d2>99 || m<10) continue;
      if(d1%base===0 || d2%base===0) continue;
      return {type:"pickM", title:"哪一個是 "+base+" 的倍數？", body:joinList(shuffle([m,d1,d2])),
              ans:m, meta:{base:base, opts:[m,d1,d2]}};
    }
  },
  /* 三個數裡，只有一個是因數 */
  pickF:function(){
    var n = pick([24,30,36,40,42,48,54,56,60,64,72]);
    var f = factorsOf(n).filter(function(x){ return x>=3 && x<=n/2; });
    for(;;){
      var a = pick(f), d1 = a + pick([-2,-1,1,2]), d2 = a + pick([-3,-2,-1,1,2,3]);
      if(d1===d2 || d1<2 || d2<2) continue;
      if(n%d1===0 || n%d2===0) continue;
      return {type:"pickF", title:"哪一個是 "+n+" 的因數？", body:joinList(shuffle([a,d1,d2])),
              ans:a, meta:{n:n, opts:[a,d1,d2]}};
    }
  },
  /* 因數一共有幾個 */
  count:function(){
    var n = pick([6,8,9,10,12,14,15,16,18,20,21,22,25,27,28]);
    return {type:"count", title:n+" 的因數", body:"一共有幾個？", ans:factorsOf(n).length, meta:{n:n}};
  },
  /* 比某個數大的最小倍數 */
  next:function(){
    var base = ri(6,9), m;
    do{ m = ri(20,70); }while(m%base===0);
    return {type:"next", title:base+" 的倍數裡", body:"比 "+m+" 大的，最小是？",
            ans:(Math.floor(m/base)+1)*base, meta:{base:base, m:m}};
  }
};
/* 三種難度，全場統一選一個。數字大小和題型都跟著難度走：
   簡單＝小數字、直接看得出來；普通＝要動手找因數、判斷倍數；困難＝數字大，還要數個數、找範圍 */
var LEVELS = ["簡單","普通","困難"];
var TIERS = [
  ["seq","pair","edge","nth","blank"],
  ["blank","nth","pickM","pair","seq","edge"],
  ["count","next","blank","pickF","pickM","pair","nth"]
];
function makeQuestion(lv, prevType){
  var type;
  do{ type = pick(TIERS[lv]); }while(type===prevType);
  return GEN[type](lv);
}

/* ===================================================================
   聲音：全部用 Web Audio 現場合成，沒有任何音檔。
   背景音樂是為賽船原創的一首 6/8 拍水手吉格舞曲，樂譜見下方 SEC_A、SEC_B。
   =================================================================== */
var AU = {ctx:null, music:null, sfx:null, noise:null, musicOn:true, timer:0, nextT:0, step:0, bpm:132};
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state==="suspended") AU.ctx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  var c = new AC(); AU.ctx = c;
  var comp = c.createDynamicsCompressor(); comp.connect(c.destination);
  var lp = c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3000; lp.connect(comp);
  AU.music = c.createGain(); AU.music.gain.value = AU.musicOn?0.5:0; AU.music.connect(lp);
  AU.sfx = c.createGain(); AU.sfx.gain.value = 0.85; AU.sfx.connect(comp);
  var len = Math.floor(c.sampleRate*0.3), buf = c.createBuffer(1,len,c.sampleRate), d = buf.getChannelData(0);
  for(var i=0;i<len;i++) d[i] = Math.random()*2-1;
  AU.noise = buf;
}
function tone(dest, type, freq, t, dur, vol, slideTo){
  var c=AU.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.03);
}
function hiss(dest, t, dur, vol, ftype, freq){
  var c=AU.ctx, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=AU.noise; f.type=ftype; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t+dur+0.02);
}
/* 旋律：[MIDI 音高, 幾個八分音符]。6/8 拍的吉格舞曲，一小節 6 個八分音符，
   重音落在第 1、第 4 個——「長短、長短」的蹦跳感就是水手舞曲的味道。
   這首是為賽船原創的（G 大調），沒有用任何現成的曲子，跟拔河的康康舞曲不同。 */
var SEC_A = [[79,2],[83,1],[86,2],[83,1],  [79,1],[83,1],[79,1],[76,2],[74,1],
             [76,2],[79,1],[84,2],[79,1],  [78,1],[81,1],[78,1],[74,3],
             [79,2],[83,1],[86,2],[83,1],  [83,1],[86,1],[83,1],[79,2],[76,1],
             [76,1],[79,1],[84,1],[81,1],[78,1],[74,1],  [79,3],[79,2],[74,1]];
var SEC_B = [[83,2],[79,1],[76,2],[79,1],  [83,1],[79,1],[76,1],[71,3],
             [84,2],[79,1],[76,2],[79,1],  [81,1],[78,1],[74,1],[81,3],
             [86,2],[83,1],[79,2],[83,1],  [84,2],[79,1],[76,2],[79,1],
             [81,1],[83,1],[81,1],[78,1],[76,1],[74,1],  [79,3],[79,3]];
/* 和弦：每半小節一個（一小節兩個） */
var CH_A = ["G","G", "G","G", "C","C", "D","D", "G","G", "Em","Em", "C","D", "G","G"];
var CH_B = ["Em","Em", "Em","Em", "C","C", "D","D", "G","G", "C","C", "D","D", "G","G"];
var CHORD = {G:[43,59,62,67], C:[48,60,64,67], D:[50,57,62,66], Em:[40,59,64,67]};
var SONG = (function(){
  var mel=[], ch=[];
  [[SEC_A,CH_A],[SEC_A,CH_A],[SEC_B,CH_B],[SEC_A,CH_A]].forEach(function(sec){
    sec[0].forEach(function(n){ mel.push({m:n[0], len:n[1]}); for(var k=1;k<n[1];k++) mel.push(null); });
    ch = ch.concat(sec[1]);
  });
  return {mel:mel, ch:ch, steps:mel.length};
})();
var TEMPO = 132, TEMPO_RUSH = 158;   /* 每分鐘幾拍（一拍＝三個八分音符）。最後 20 秒加速 */
var STEPS_PER_BEAT = 3;
function scheduleStep(i, t){
  var e = 60/AU.bpm/STEPS_PER_BEAT, n = SONG.mel[i], chord = CHORD[SONG.ch[Math.floor(i/3)]], M = AU.music, k;
  var pos = i%6;                                 /* 這一步在小節裡的位置：0 和 3 是重拍 */
  if(n){                                         /* 主旋律：鋸齒波，像手風琴；切成跳音 */
    var d = Math.min(n.len*e*0.78, 0.36);
    tone(M,"sawtooth",mtof(n.m),    t, d, 0.07);
    tone(M,"triangle",mtof(n.m),    t, d, 0.12);
    tone(M,"square",  mtof(n.m+12), t, d*0.5, 0.016);
  }
  hiss(M, t, 0.025, pos%3===0?0.07:0.035, "highpass", 7000);          /* 小鈸：每個八分音符都敲 */
  if(pos===0){                                   /* 第 1 拍「碰」：低音根音＋大鼓 */
    tone(M,"triangle", mtof(chord[0]), t, e*1.6, 0.32);
    tone(M,"sine", 140, t, 0.1, 0.45, 46);
  }else if(pos===3){                             /* 第 2 拍：低音五度＋小鼓 */
    tone(M,"triangle", mtof(chord[0]+7), t, e*1.6, 0.26);
    hiss(M, t, 0.08, 0.15, "bandpass", 1900);
    tone(M,"triangle", 190, t, 0.05, 0.09, 120);
  }else if(pos===2 || pos===5){                  /* 每一拍的最後一個八分音符：和弦輕輕一下，把人帶進下一拍 */
    for(k=1;k<4;k++) tone(M,"square", mtof(chord[k]), t, e*0.5, 0.026);
  }
  if(i%48===0) hiss(M, t, 0.5, 0.09, "highpass", 5000);   /* 每一段開頭敲一下鈸 */
}
function musicPump(){
  if(!AU.ctx) return;
  while(AU.nextT < AU.ctx.currentTime + 0.14){
    scheduleStep(AU.step, AU.nextT);
    AU.nextT += 60/AU.bpm/STEPS_PER_BEAT;
    AU.step = (AU.step+1) % SONG.steps;
  }
}
function musicStart(){
  if(!AU.ctx) return;
  musicStop(); AU.step=0; AU.bpm=TEMPO; AU.nextT = AU.ctx.currentTime + 0.1;
  AU.timer = setInterval(musicPump, 25); musicPump();
}
function musicStop(){ clearInterval(AU.timer); AU.timer=0; }
var SFX = {
  ok:function(){ if(!AU.ctx) return; var t=AU.ctx.currentTime;
    tone(AU.sfx,"triangle",mtof(88),t,0.12,0.3); tone(AU.sfx,"triangle",mtof(93),t+0.08,0.2,0.3);
    hiss(AU.sfx,t,0.22,0.16,"bandpass",900); },
  no:function(){ if(!AU.ctx) return; var t=AU.ctx.currentTime;
    tone(AU.sfx,"sawtooth",150,t,0.26,0.2,95); },
  beep:function(hi){ if(!AU.ctx) return; var t=AU.ctx.currentTime;
    tone(AU.sfx,"square",hi?1320:880,t,hi?0.45:0.14,0.16); },
  win:function(){ if(!AU.ctx) return; var t=AU.ctx.currentTime;
    [72,76,79,84].forEach(function(m,k){ tone(AU.sfx,"triangle",mtof(m),t+k*0.13,0.3,0.3); });
    [72,76,79,84].forEach(function(m){ tone(AU.sfx,"triangle",mtof(m),t+0.56,0.9,0.16); }); }
};

function qAt(s, i){

  var list = G.qs[s];

}
function showQ(s){

function later(ms, fn){ var tk=G.token; setTimeout(function(){ if(tk===G.token) fn(); }, ms); }

function onKey(s, k){
  var S = G.sides[s];
  if(!G.on || !S || S.lock) return;
  if(k==="clr"){ S.input=""; showInput(s); return; }
  if(k==="ok"){ if(S.input!=="") submit(s); return; }
  if(S.input.length>=3) return;
  S.input = (S.input==="0") ? k : S.input+k;
  showInput(s);
}
function submit(s){
  var S=G.sides[s], p=PANELS[s], q=qAt(s, S.idx);
  if(parseInt(S.input,10)===q.ans){
    S.right++; S.lock=true;
    p.classList.add("good"); setMsg(s,"答對了，前進！");
    SFX.ok(); advance(s);
    if(!G.on) return;
    later(380, function(){ S.lock=false; S.idx++; showQ(s); });
  }else{
    /* 答錯就只是這一題船不會動：不公布答案、不罰時間，紅一下就換下一題。
       換題而不是留在原題，是為了不讓人整場卡在同一題上。 */
    S.wrong++; S.lock=true; SFX.no();
    p.classList.add("bad","locked");

/* ===================================================================
   自我檢查：在主控台輸入 __selftest(20000)，回傳各項錯誤數（應該全是 0）
   =================================================================== */
window.__selftest=function(N){
  N=N||5000;
  var bad={answer:0, range:0, unique:0, words:0, repeat:0, tier:0, song:0}, seen={}, prev="";
  for(var i=0;i<N;i++){
    var lv=i%3, q=makeQuestion(lv, prev), m=q.meta, f, ok;
    if(q.type===prev) bad.repeat++;
    if(TIERS[lv].indexOf(q.type)<0) bad.tier++;
    prev=q.type; seen[q.type]=(seen[q.type]||0)+1;
    if(!(Number.isInteger(q.ans) && q.ans>=1 && q.ans<=999)) bad.range++;
    if(/質數|公因數|公倍數/.test(q.title+q.body)) bad.words++;
    /* 用跟出題不同的算法重算一次答案 */
    if(q.type==="seq"){
      ok = m.terms.every(function(t,k){ return t%m.base===0 && (k===0 || t-m.terms[k-1]===m.base); }) && q.ans===m.terms[m.hole];
    }else if(q.type==="pair"){ ok = m.a*q.ans===m.n && m.a>1 && m.a<m.n;
    }else if(q.type==="edge"){
      f=factorsOf(m.n);
      ok = m.kind==="maxF" ? q.ans===Math.max.apply(null,f) : m.kind==="minF" ? q.ans===Math.min.apply(null,f) : q.ans===m.n;
    }else if(q.type==="nth"){ var c=0,x=0; while(c<m.k){ x++; if(x%m.base===0) c++; } ok = q.ans===x;
    }else if(q.type==="blank"){ f=factorsOf(m.n); ok = f[m.hole]===q.ans && m.hole>0 && m.hole<f.length-1 && f.length<=9;
    }else if(q.type==="pickM"){
      ok = q.ans%m.base===0;
      if(m.opts.filter(function(v){ return v%m.base===0; }).length!==1 || new Set(m.opts).size!==3) bad.unique++;
    }else if(q.type==="pickF"){
      ok = m.n%q.ans===0;
      if(m.opts.filter(function(v){ return m.n%v===0; }).length!==1 || new Set(m.opts).size!==3) bad.unique++;
    }else if(q.type==="count"){ var k2=0; for(var y=1;y<=m.n;y++) if(m.n%y===0) k2++; ok = q.ans===k2;
    }else if(q.type==="next"){ var z=m.m+1; while(z%m.base!==0) z++; ok = q.ans===z && m.m%m.base!==0;
    }else ok=false;
    if(!ok) bad.answer++;
  }
  /* 樂譜：每一段都要剛好 8 小節（6/8 拍，48 個八分音符），和弦每半小節一個 */
  [SEC_A,SEC_B].forEach(function(sec){ if(sec.reduce(function(a,n){ return a+n[1]; },0)!==48) bad.song++; });
  if(SONG.steps!==192 || SONG.ch.length!==64) bad.song++;
  SONG.ch.forEach(function(c){ if(!CHORD[c]) bad.song++; });
  return {bad:bad, types:seen};
};
window.__game=G;
})();
</script>
